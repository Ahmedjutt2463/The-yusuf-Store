services:
  - type: web
    name: the-yusuf-store
    runtime: node
    repo: https://github.com/Ahmedjutt2463/The-yusuf-Store
    branch: master
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
